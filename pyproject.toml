[project]
name = "cloakbrowser-proxy-manager"
version = "0.1.0"
description = "CloakBrowser Manager native and container application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "cloakbrowser[geoip]",
    "websockets>=14.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
